version: '3.8'

services:
  db:
    image: postgres:15
    container_name: db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: db
    ports:
      - "5432:5432"
    volumes:
      - db-data-api:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  test_db:
    image: postgres:15
    container_name: test_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: testdb
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    
  go_test:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: go_app
    environment:
      - test_DBHOST=test_db
      - test_DBNAME=testdb
      - test_DBPASSWORD=postgres
      - test_DBUSER=postgres
      - test_DBPORT=5432
    working_dir: /app
    volumes:
      - .:/app
    depends_on:
      test_db:
        condition: service_healthy

  go_api:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: go_api
    environment:
      - DBHOST=db
      - DBNAME=db
      - DBPASSWORD=postgres
      - DBUSER=postgres
      - DBPORT=5432
      - APPHOST=0.0.0.0:8000
    volumes:
      - .:/app
    command: ["go","run","."]
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data-api:
